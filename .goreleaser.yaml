version: 2

project_name: zesh

before:
  hooks:
    - go mod tidy

builds:
  - id: cli
    binary: zesh-{{ .Os }}-{{ .Arch }}
    main: ./cmd/cli
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    no_unique_dist_dir: true

  - id: mcp
    binary: zesh-mcp-{{ .Os }}-{{ .Arch }}
    main: ./cmd/mcp
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    no_unique_dist_dir: true

archives:
  - format: binary
    name_template: "{{ .Binary }}"
    allow_different_binary_count: true

checksum:
  name_template: checksums.txt

release:
  github:
    owner: codemem-io
    name: zesh
  name_template: "{{ .Tag }}"
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
